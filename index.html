<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WinVamp</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --metal: #3a2f52; --metal-hi: #7a66a3; --metal-lo: #120c1c;
    --lcd: #05060a; --led: #7dff5a; --orange: #ff7a18; --bone: #e9e0c9; --dim: #9a8db8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: var(--bone);
    font: 18px/1.15 VT323, Consolas, monospace; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; filter: saturate(.72) brightness(.8); }
  #scan { position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.12) 0 1px, transparent 1px 3px); }
  #main.shade > :not(.bar) { display: none; }
  body.classic #stage, body.stark #stage, body.stream #stage { filter: none; }
  #picker, .vis-row { gap: 2px; }
  #chill { flex-wrap: wrap; }
  #chill button { flex: 1 1 23%; }
  #list[data-frame=chill] { background: #e8dcc6; border-color: #fff4e0; border-radius: 10px; box-shadow: 0 6px 22px rgba(0,0,0,.45); }
  #list[data-frame=chill] .bar { background: #e8dcc6; color: #6a5238; letter-spacing: 2px; }
  #list[data-frame=chill] .bar span { background: none; }
  .vis-row button { flex: 1; min-width: 0; padding: 3px 0; font-size: 16px; }
  #tabStatus { flex: none; min-width: 112px; padding: 0 4px; text-align: center; color: var(--dim); }
  #tabStatus.good { color: var(--led); }
  #tabStatus.bad { color: #ff9c6b; }
  #picker button { flex: 1; min-width: 0; min-height: 24px; padding: 0; font-size: 16px; }
  body.dock-away { cursor: none; }
  #dock { display: none; position: fixed; left: 0; right: 0; top: 0; z-index: 4; height: 34px; align-items: center; gap: 3px;
    padding: 2px 6px; background: var(--metal); border-bottom: 2px solid var(--metal-lo); transition: transform .25s; }
  #dock button { min-height: 26px; padding: 0 7px; font-size: 16px; }
  #dockClock { padding: 0 6px; color: var(--led); }
  #dockTitle { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--led); }
  body.party #dock { display: flex; }
  body.dock-bottom #dock { top: auto; bottom: 0; border-bottom: 0; border-top: 2px solid var(--metal-hi); }
  body.dock-away #dock { transform: translateY(-110%); }
  body.dock-away.dock-bottom #dock { transform: translateY(110%); }
  @media (max-width: 700px) { #dockTitle { flex: none; width: 0; } }

  .win { position: fixed; width: 366px; max-width: calc(100vw - 32px); user-select: none;
    background: var(--metal); padding: 3px;
    border: 2px solid; border-color: var(--metal-hi) var(--metal-lo) var(--metal-lo) var(--metal-hi);
    box-shadow: 0 8px 28px rgba(0,0,0,.65); transition: opacity .3s; }
  /* YouTube's rules: the player stays on screen, at least 200x200, with nothing in front of it. */
  body.party #main { opacity: 0; pointer-events: none; }
  body.party #menu { top: 42px; left: 16px; right: auto; }
  body.party.dock-bottom #menu { top: auto; bottom: 42px; }
  body.party.dock-bottom #list { bottom: 42px; }
  body.party #list > :not(#yt-wrap, .bar, .grip) { display: none; }
  body.party #list { left: auto !important; top: auto !important; right: 8px; bottom: 8px; width: var(--cam-w, 210px); }
  body.party #yt-wrap { margin-top: 0; }
  body.party.stream #list { left: 12px !important; right: auto; width: var(--stream-w, 366px); }
  body.party.stream #menu { left: auto; right: 16px; }
  .grip { position: absolute; right: 0; bottom: 0; z-index: 1; width: 16px; height: 16px; cursor: nwse-resize; touch-action: none;
    background: repeating-linear-gradient(135deg, transparent 0 3px, var(--orange) 3px 5px); }
  #list .grip { top: 3px; right: 3px; bottom: auto; height: 20px; cursor: ew-resize; }
  body.party #list .grip { left: 3px; right: auto; }
  body.party.stream #list .grip { left: auto; right: 3px; }
  .bar button { min-height: 16px; height: 16px; margin-left: auto; padding: 0 6px; font-size: 14px; line-height: 12px; letter-spacing: 0; }

  /* The video's frame follows whatever is on screen. */
  #list { width: var(--list-w, 366px); --accent: #7a66a3; }
  #list[data-frame=spooky] { background: #0c0a10; border-color: var(--accent); box-shadow: 0 0 22px var(--accent); }
  #list[data-frame=spooky] .bar { background: #0c0a10; color: var(--accent); }
  #list[data-frame=spooky] .bar span { background: none; }
  #list[data-frame=wmp9] { border-color: #4f9be0; border-radius: 8px; background: linear-gradient(#123a70, #06182f); box-shadow: 0 0 18px #2a6fc4; }
  #list[data-frame=wmp9] .bar { background: linear-gradient(#2a6fc4, #0d2f5e); color: #dff0ff; border-radius: 5px 5px 0 0; }
  #list[data-frame=wmp9] .bar span { background: none; }
  #list[data-frame=xp] { border: 3px solid #0a4fd0; border-radius: 8px 8px 2px 2px; background: #0a4fd0; }
  #list[data-frame=xp] .bar { background: linear-gradient(#3b8cf5, #0a5fe0 45%, #0a4fd0); color: #fff; border-radius: 5px 5px 0 0; letter-spacing: 1px; }
  #list[data-frame=xp] .bar span { background: none; }
  #list[data-frame=stream] { background: #120a22; border-color: #e23bff; box-shadow: 0 0 20px #e23bff, 0 0 44px rgba(90,240,255,.45); }
  #list[data-frame=stream] .bar { background: linear-gradient(90deg, #e23bff, #5af0ff); color: #120a22; }
  #list[data-frame=stream] .bar span { background: none; }
  body.no-video #list { display: none; }
  body.dragging iframe { pointer-events: none; }
  #main { left: 16px; top: 16px; z-index: 2; }
  #list { left: 16px; top: 236px; z-index: 2; }
  #menu { right: 16px; top: 16px; width: 400px; max-height: calc(100vh - 32px); overflow: auto; z-index: 3; }

  .bar { display: flex; align-items: center; gap: 8px; height: 20px; padding: 0 6px; cursor: grab;
    color: var(--orange); letter-spacing: 3px; font-size: 16px; touch-action: none;
    background: repeating-linear-gradient(0deg, #55436f 0 1px, #241a35 1px 3px); }
  .bar span { background: var(--metal); padding: 0 6px; }
  .bar:active { cursor: grabbing; }

  .lcd { display: grid; grid-template-columns: 112px 1fr; gap: 6px; margin: 4px 0; padding: 6px;
    background: var(--lcd); border: 2px solid;
    border-color: var(--metal-lo) var(--metal-hi) var(--metal-hi) var(--metal-lo); }
  #clock { color: var(--led); font-size: 46px; line-height: 36px; text-shadow: 0 0 8px rgba(125,255,90,.55); }
  #mini { width: 100%; height: 40px; display: block; cursor: pointer; image-rendering: pixelated; }
  #marquee { grid-column: 1 / -1; overflow: hidden; white-space: nowrap; color: var(--led); height: 20px; }
  #marquee b { display: inline-block; font-weight: 400; padding-left: 100%; animation: scroll 16s linear infinite; }
  @keyframes scroll { to { transform: translateX(-100%); } }
  #stats { display: flex; justify-content: space-between; margin-top: 6px; color: var(--dim); }
  #stats i { font-style: normal; color: var(--orange); }

  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 12px; margin: 0;
    background: var(--metal-lo); border: 1px solid #000; cursor: pointer; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 12px;
    background: var(--orange); border: 1px solid #ffc489; }
  input[type=range]::-moz-range-thumb { width: 22px; height: 12px; border-radius: 0;
    background: var(--orange); border: 1px solid #ffc489; }

  .row { display: flex; align-items: center; gap: 4px; margin-top: 4px; }
  .row label { color: var(--dim); flex: none; }
  button { font: inherit; color: var(--bone); background: var(--metal); padding: 3px 9px; cursor: pointer;
    min-height: 28px; border: 2px solid; border-color: var(--metal-hi) var(--metal-lo) var(--metal-lo) var(--metal-hi); }
  button:hover { color: #fff; background: #4a3c68; }
  button:active { border-color: var(--metal-lo) var(--metal-hi) var(--metal-hi) var(--metal-lo); }
  button.on { color: #120c1c; background: var(--orange); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--led); outline-offset: 1px; }
  .grow { flex: 1; }
  .spacer { margin-left: auto; }

  #yt-wrap { position: relative; width: 100%; aspect-ratio: 16 / 9; min-height: 200px; background: #000; margin-top: 4px; }
  #yt-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #yt-empty { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px;
    text-align: center; color: var(--dim); }
  #url { font: inherit; width: 100%; min-width: 0; padding: 3px 6px; height: 28px; color: var(--led);
    background: var(--lcd); border: 1px solid var(--metal-lo); user-select: text; }
  #note { margin-top: 4px; padding: 2px 4px; color: var(--bone); }
  #note:empty { display: none; }
  #note.bad { color: #ff9c6b; }
  #hint { margin-top: 4px; color: var(--dim); font-size: 16px; line-height: 1.1; }
  @media (max-height: 520px) { #list { left: 398px; top: 16px; } }
  @media (max-width: 860px) {
    html, body { overflow: auto; }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="scan"></div>

<section class="win" id="main" aria-label="Player">
  <div class="bar" data-drag><span>WINVAMP</span><button id="mainHide" title="Hide the controls (H)">_</button></div>
  <div class="grip" data-size="main" title="Drag to resize"></div>
  <div class="lcd">
    <div id="clock">00:00</div>
    <canvas id="mini" width="152" height="40" title="Click to switch between spectrum and oscilloscope"></canvas>
    <div id="marquee"><b id="title">*** WINVAMP *** IT REALLY WHIPS THE VAMPIRE'S ASS ***</b></div>
  </div>
  <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek">
  <div class="row">
    <button id="prev" aria-label="Previous track">|&lt;</button>
    <button id="play" aria-label="Play">&gt;</button>
    <button id="pause" aria-label="Pause">||</button>
    <button id="next" aria-label="Next track">&gt;|</button>
    <button id="shuffle" title="Shuffle the playlist">SHUF</button>
    <label class="spacer" for="vol">VOL</label>
    <input type="range" id="vol" min="0" max="100" value="80" style="width:96px">
  </div>
  <div class="row">
    <button id="menuBtn" class="grow" title="Scenes, visualizers, shuffles and tab audio (Q)">MENU</button>
    <button id="party" class="grow" title="Shrink everything to a bar that hides itself (H)">BAR</button>
    <button id="full" class="grow" title="Fullscreen party mode. Esc to leave (F)">FULL</button>
  </div>
</section>

<section class="win" id="list" aria-label="Playlist">
  <div class="bar" data-drag><span id="frameName">PLAYLIST</span></div>
  <div class="grip" data-size="list" title="Drag to resize the video"></div>
  <div class="row">
    <input id="url" class="grow" placeholder="Paste a YouTube playlist link" aria-label="YouTube playlist link" spellcheck="false">
    <button id="load">LOAD</button>
  </div>
  <div id="yt-wrap"><div id="yt-empty">No playlist loaded yet</div><div id="yt"></div></div>
  <div id="note"></div>
</section>

<section class="win" id="menu" aria-label="Menu" hidden>
  <div class="bar" data-drag><span>MENU</span><button data-click="menuBtn" title="Close the menu">X</button></div>
  <div class="grip" data-size="menu" title="Drag to resize"></div>
  <div class="row">
    <button id="srcTab" class="grow" title="Makes the visuals follow the video playing here">REACT TO THIS TAB</button>
    <span id="tabStatus">OFF</span>
  </div>
  <div class="row">
    <button id="srcOther" class="grow" title="Makes the visuals follow another tab, and removes the video here">LISTEN TO ANOTHER TAB</button>
  </div>
  <div class="row">
    <button id="shuffleSpooky" class="grow" data-mode="spooky" title="Random Halloween scenes (S)">SPOOKY SCARY SHUFFLE</button>
    <button id="shuffleClassic" class="grow" data-mode="classics" title="Random classics (X)">CLASSIC SHUFFLE</button>
  </div>
  <div class="row">
    <button id="shuffleWmp" class="grow" data-mode="wmp9" title="Rotates the Windows Media Player 9 set">WMP 9 ROTATE</button>
    <button id="shuffleXp" class="grow" data-mode="xp" title="Rotates the Windows XP set">XP ROTATE</button>
  </div>
  <div class="row"><label>SCENES</label><span class="spacer"></span><button id="scene" title="Next scene (N)">NEXT SCENE</button></div>
  <div class="row" id="picker" role="group" aria-label="Choose a scene"></div>
  <div class="row"><label>WINAMP CLASSIC</label></div>
  <div class="row vis-row" id="classics" role="group" aria-label="Winamp classic visualizers"></div>
  <div class="row"><label>CHILL</label><span class="spacer"></span><button id="shuffleChill" data-mode="chill" title="Slowly rotates the chill set">CHILL ROTATE</button></div>
  <div class="row vis-row" id="chill" role="group" aria-label="Chill scenes"></div>
  <div class="row"><label>WINDOWS MEDIA PLAYER 9</label></div>
  <div class="row vis-row" id="wmp9" role="group" aria-label="Windows Media Player 9 visualizers"></div>
  <div class="row"><label>WINDOWS XP</label></div>
  <div class="row vis-row" id="xp" role="group" aria-label="Windows XP visualizers"></div>
  <div id="stats"><span><i>666</i> kbps</span><span><i>31</i> kHz</span><span>scene <i id="sceneName">-</i></span><span id="trackNo">-/-</span></div>
  <div id="hint">Q menu · H bar · F full · Esc leave · N next scene · W visualizers · S spooky · X classic · 1-9, Shift+1-8 scenes</div>
</section>

<nav id="dock" aria-label="Controls bar">
  <button data-click="prev" aria-label="Previous track">|&lt;</button>
  <button data-click="play" aria-label="Play">&gt;</button>
  <button data-click="pause" aria-label="Pause">||</button>
  <button data-click="next" aria-label="Next track">&gt;|</button>
  <span id="dockClock">00:00</span>
  <span id="dockTitle">WINVAMP</span>
  <button data-click="scene" title="Next scene">NEXT</button>
  <button data-click="menuBtn" title="Scenes, visualizers, shuffles and tab audio">MENU</button>
  <button id="dockFlip" title="Move the bar to the other edge">BOTTOM</button>
  <button id="dockPin" title="Keep the bar on screen">PIN</button>
  <button data-click="full" title="Fullscreen on or off">FULL</button>
  <button id="dockHide" title="Hide this bar. Move the mouse to bring it back">HIDE</button>
  <button data-click="party" title="Back to the full player">EXPAND</button>
</nav>

<script>
// Paste your playlist link or ID here so it loads for everyone without pasting it in.
const PLAYLIST = '';

const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
let noteTimer = 0;
const note = (msg, bad) => {
  $('note').textContent = msg;
  $('note').className = bad ? 'bad' : '';
  clearTimeout(noteTimer);
  noteTimer = setTimeout(() => { $('note').textContent = ''; }, bad ? 16000 : 8000);
};

/* ---------- pulse ---------- */
const BINS = 1024, BARS = 64;
const A = {
  ctx: null, analyser: null, stream: null, src: null, live: false, heard: 0,
  freq: new Uint8Array(BINS), wave: new Uint8Array(BINS * 2),
  bars: new Float32Array(BARS), peaks: new Float32Array(BARS),
  bass: 0, mid: 0, treble: 0, level: 0, peak: .1,
  beat: false, big: false, pulse: 0, hist: new Float32Array(45), hi: 0, lastBeat: 0,
};

function stopTab() {
  A.src?.disconnect();
  A.stream?.getTracks().forEach(tr => { tr.onended = null; tr.stop(); });
  A.stream = A.src = A.analyser = null;
  A.live = false;
  $('srcTab').classList.remove('on');
  $('srcOther').classList.remove('on');
  document.body.classList.remove('no-video');
}

async function useTab(other) {
  if (A.stream) { stopTab(); return note('Tab audio off. The visuals are back on their built-in pulse.'); }
  if (!navigator.mediaDevices?.getDisplayMedia) return note('This browser cannot share tab audio. Use Chrome or Edge on a computer.', true);
  // Started inside the click: once the popup has closed, Chrome can refuse to start it.
  A.ctx ||= new (window.AudioContext || window.webkitAudioContext)();
  A.ctx.resume();
  try {
    note(other ? 'In the popup, pick the tab with the music and switch on "Also share tab audio".' : 'In the popup, share this tab and switch on "Also share tab audio".');
    // Chrome normally jumps to the shared tab, and the visuals stop when this tab is hidden.
    const controller = other && window.CaptureController ? new CaptureController() : null;
    try { controller?.setFocusBehavior('no-focus-change'); } catch {}
    // Plain options for another tab: Chrome ignores no-focus-change with the tuned ones.
    const stream = await navigator.mediaDevices.getDisplayMedia(other
      ? { video: true, audio: true, systemAudio: 'include', selfBrowserSurface: 'exclude', ...(controller ? { controller } : {}) }
      : {
        video: { frameRate: 1, width: 320 },
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, suppressLocalAudioPlayback: false },
        systemAudio: 'include', preferCurrentTab: true,
      });
    if (!stream.getAudioTracks().length) {
      stream.getTracks().forEach(tr => tr.stop());
      return note('No audio came through. Press the button again and switch on "Also share tab audio".', true);
    }
    await A.ctx.resume();
    const analyser = A.ctx.createAnalyser();
    analyser.fftSize = BINS * 2;
    analyser.smoothingTimeConstant = .72;
    analyser.minDecibels = -85;
    analyser.maxDecibels = -18;
    // Never connected to the speakers: the tab already plays this audio.
    const src = A.ctx.createMediaStreamSource(stream);
    src.connect(analyser);
    Object.assign(A, { stream, src, analyser, peak: .1, heard: performance.now() / 1000 });
    stream.getAudioTracks().forEach(tr => tr.onended = () => {
      if (A.stream !== stream) return;
      stopTab();
      note('Sharing stopped. The video is back.', true);
    });
    $(other ? 'srcOther' : 'srcTab').classList.add('on');
    if (other) {
      // YouTube's rules: nothing plays from a player that isn't on screen.
      if (yt.ready) yt.player.pauseVideo();
      document.body.classList.add('no-video');
    }
    note('Connected. Press play and watch the status next to the button.');
  } catch (err) {
    note(err.name === 'NotAllowedError' ? 'Sharing was cancelled. Press the button to try again.' : `Tab audio failed: ${err.message}`, true);
  }
}

function tabStatus(t) {
  const el = $('tabStatus');
  const text = !A.stream ? 'OFF' : A.ctx.state !== 'running' ? 'AUDIO PAUSED' : A.live ? 'HEARING IT' : t - A.heard > 3 ? 'NO SOUND' : 'LISTENING';
  el.textContent = text;
  el.className = text === 'HEARING IT' ? 'good' : text === 'NO SOUND' || text === 'AUDIO PAUSED' ? 'bad' : '';
  if (text === 'AUDIO PAUSED') A.ctx.resume();
}

// The built-in pulse, used whenever real sound isn't reaching the page.
function fakeAudio(t) {
  const amp = yt.playing ? .85 : .55, b = t * 88 / 60;
  const kick = Math.exp(-(b % 1) * 7), hat = Math.exp(-((b * 2) % 1) * 12);
  for (let i = 0; i < BINS; i++) {
    const x = i / BINS;
    const v = kick * 240 * Math.exp(-x * 70)
      + (100 + 70 * Math.sin(b * .5 + i * .02)) * Math.exp(-x * 9) * (.7 + .3 * Math.random())
      + hat * 120 * Math.exp(-((x - .35) ** 2) * 40);
    A.freq[i] = Math.min(255, v * amp);
  }
  for (let i = 0; i < A.wave.length; i++) {
    A.wave[i] = 128 + (Math.sin(i * .03 + t * 9) * kick * 70 + Math.sin(i * .11 + t * 3) * 22) * amp;
  }
}

function readAudio(t, k) {
  if (A.analyser) {
    A.analyser.getByteFrequencyData(A.freq);
    A.analyser.getByteTimeDomainData(A.wave);
    if (A.freq.some(v => v > 24)) A.heard = t;
  }
  A.live = !!A.analyser && t - A.heard < 3;
  if (!A.live) fakeAudio(t);
  const CALM = A.live ? .95 : .6; // how hard the visuals react: 1 is full strength

  const avg =(a, b) => { let s = 0; for (let i = a; i < b; i++) s += A.freq[i]; return s / (b - a) / 255; };
  const rb = avg(1, 7), rm = avg(12, 85), rt = avg(170, 500);
  A.peak = Math.max(rb, rm * 1.5, A.peak * Math.pow(.9985, k), .08);
  const g = 1 / A.peak, soft = clamp(.16 * k), bass = clamp(rb * g);
  A.bass += (bass * CALM - A.bass) * soft;
  A.mid += (clamp(rm * g * 1.5) * CALM - A.mid) * soft;
  A.treble += (clamp(rt * g * 3) * CALM - A.treble) * soft;
  A.level = (A.bass + A.mid + A.treble) / 3;

  const top = BINS * .6;
  for (let i = 0; i < BARS; i++) {
    const a = Math.floor(Math.pow(top, i / BARS)), b = Math.max(a + 1, Math.floor(Math.pow(top, (i + 1) / BARS)));
    const v = clamp(avg(a, b) * g * (1 + i / BARS * 1.4)) * .75;
    A.bars[i] += (v - A.bars[i]) * clamp(.22 * k);
    A.peaks[i] = Math.max(A.bars[i], A.peaks[i] - .006 * k);
  }

  let mean = 0;
  for (const v of A.hist) mean += v;
  mean /= A.hist.length;
  A.hist[A.hi++ % A.hist.length] = bass;
  A.beat = A.big = false;
  if (bass > mean * 1.3 + .06 && t - A.lastBeat > .34) {
    A.beat = true;
    A.big = bass > mean * 1.6 + .1;
    A.lastBeat = t;
    A.pulse = .6;
  }
  A.pulse *= Math.pow(.93, k);
}

/* ---------- drawing kit ---------- */
const stage = $('stage'), c = stage.getContext('2d', { alpha: false });
const buf = document.createElement('canvas'), bc = buf.getContext('2d');
let W = 0, H = 0, U = 1;

function resize() {
  const s = Math.min(1, 1280 / innerWidth);
  W = buf.width = stage.width = Math.round(innerWidth * s);
  H = buf.height = stage.height = Math.round(innerHeight * s);

function buildMaze() {
  const g = Array.from({ length: MAZE }, () => new Uint8Array(MAZE).fill(1));
  const stack = [[1, 1]];
  g[1][1] = 0;
  while (stack.length) {
    const [x, y] = stack[stack.length - 1];
    const open = [[2, 0], [-2, 0], [0, 2], [0, -2]].filter(([dx, dy]) => {
      const a = x + dx, b = y + dy;
      return a > 0 && b > 0 && a < MAZE - 1 && b < MAZE - 1 && g[b][a];
    });
    if (!open.length) { stack.pop(); continue; }
    const [dx, dy] = open[Math.floor(rnd(0, open.length))];
    g[y + dy / 2][x + dx / 2] = 0;
    g[y + dy][x + dx] = 0;
    stack.push([x + dx, y + dy]);
  }
  // Knock through some walls so there are loops to be chased around.
  for (let i = 0; i < 60; i++) {
    const x = 1 + Math.floor(rnd(0, MAZE - 2)), y = 1 + Math.floor(rnd(0, MAZE - 2));
    if ((x + y) % 2) g[y][x] = 0;
  }
  return g;
}

function mazePath([sx, sy], [tx, ty]) {
  const from = new Map([[sx + sy * MAZE, -1]]), queue = [[sx, sy]];
  while (queue.length) {
    const [x, y] = queue.shift();
    if (x === tx && y === ty) break;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const key = x + dx + (y + dy) * MAZE;
      if (mz.grid[y + dy][x + dx] || from.has(key)) continue;
      from.set(key, x + y * MAZE);
      queue.push([x + dx, y + dy]);
    }
  }
  const path = [];
  for (let key = tx + ty * MAZE; key !== -1; key = from.get(key)) path.unshift([key % MAZE, Math.floor(key / MAZE)]);
  return path;
}

function extendRoute() {
  const end = mz.route[mz.route.length - 1];
  let x, y;
  do {
    x = 1 + 2 * Math.floor(rnd(0, (MAZE - 1) / 2));
    y = 1 + 2 * Math.floor(rnd(0, (MAZE - 1) / 2));
  } while (Math.abs(x - end[0]) + Math.abs(y - end[1]) < 12);
  mz.route.push(...mazePath(end, [x, y]).slice(1));
}

function startMaze() {
  mz.grid = buildMaze();
  mz.route = [[1, 1]];
  while (mz.route.length < 40) extendRoute();
  mz.pi = BEHIND + 1; mz.mi = 1;
  const [ax, ay] = mazePoint(mz.pi), [bx, by] = mazePoint(mz.pi + .6);
  mz.yaw = Math.atan2(by - ay, bx - ax);
}

function mazePoint(i) {
  const n = Math.min(Math.floor(i), mz.route.length - 2), f = i - n, a = mz.route[n], b = mz.route[n + 1];
  return [a[0] + (b[0] - a[0]) * f + .5, a[1] + (b[1] - a[1]) * f + .5];
}

function mazeSees(ax, ay, bx, by) {
  const steps = Math.ceil(Math.hypot(bx - ax, by - ay) * 4);
  for (let i = 1; i < steps; i++) {
    const q = i / steps;
    if (mz.grid[Math.floor(ay + (by - ay) * q)][Math.floor(ax + (bx - ax) * q)]) return false;
  }
  return true;
}

function drawGhosts(t, dt) {
  for (let i = ghosts.length - 1; i >= 0; i--) {
    const g = ghosts[i];
    g.y -= g.vy * dt; g.life -= dt * .11;
    if (g.life <= 0 || g.y < -.12) { ghosts.splice(i, 1); continue; }
    const x = (g.x + Math.sin(t * 1.6 + g.ph) * .03) * W, s = g.s * U * (1 + A.pulse * .14);
    if (g.skull) drawSkull(x, g.y * H, s, A.bass, Math.sin(t + g.ph) * .35, clamp(g.life * 2));
    else drawGhost(x, g.y * H, s, t, A.mid, clamp(g.life * 1.6) * .92);
  }
}

function drawMotes(dt, size) {
  for (let i = motes.length - 1; i >= 0; i--) {
    const m = motes[i];
    m.x += m.vx * dt; m.y += m.vy * dt; m.life -= dt * .9;
    if (m.life <= 0) { motes.splice(i, 1); continue; }
    c.globalAlpha = clamp(m.life * 1.5);
    disc(m.x, m.y, size * U * m.life, m.col);
  }
  c.globalAlpha = 1;
  if (motes.length > 500) motes.splice(0, motes.length - 500);
}

// Plain old-school swirl: colour rings fed back into themselves.
function drawSwirl(t) {
  feedback({ zoom: 1.022 + A.bass * .02, spin: .007 + Math.sin(t * .13) * .012, keep: .925 });
  c.lineWidth = 3 * U;
  for (let arm = 0; arm < 4; arm++) {

    c.strokeStyle = `hsl(${t * 35 + arm * 28} 100% 55%)`;

      const a = i / 180 * Math.PI * 2, w = (A.wave[(i % 180) * 6] - 128) / 128;
      const r = R * (1 + Math.sin(a * lobes + t * 1.3 * dir) * .34 + w * .5), turn = a + t * (.4 + arm * .15) * dir;
      const x = W / 2 + Math.cos(turn) * r, y = H / 2 + Math.sin(turn) * r;

}

// Sine plasma computed small and scaled up, the way the old demos did it.
const plasma = document.createElement('canvas');

  }

function drawPeaks(t) {
  const sky = c.createLinearGradient(0, 0, 0, H * .8);

function drawStarry(t) {

function qSprite(key, rows, pal) {
  const id = `${key}${Object.values(pal).join('')}`;
  if (qCache.has(id)) return qCache.get(id);
  const s = document.createElement('canvas');
  s.width = rows[0].length; s.height = rows.length;
  const x = s.getContext('2d');
  rows.forEach((row, ry) => [...row].forEach((ch, rx) => {
    if (pal[ch]) { x.fillStyle = pal[ch]; x.fillRect(rx, ry, 1, 1); }
  }));
  qCache.set(id, s);
  return s;
}

function qTile(theme, wall) {
  const id = `tile${theme.name}${wall}`;
  if (qCache.has(id)) return qCache.get(id);
  const s = document.createElement('canvas');
  s.width = s.height = QTILE;
  const x = s.getContext('2d');
  if (wall) {
    x.fillStyle = theme.lo; x.fillRect(0, 0, 16, 16);
    for (let r = 0; r < 4; r++) for (let i = -1; i < 2; i++) {
      x.fillStyle = (r + i) % 2 ? theme.hi : theme.mid;
      x.fillRect(i * 8 + (r % 2 ? 4 : 0) + 1, r * 4 + 1, 6, 2);
    }
  } else {
    x.fillStyle = theme.floor; x.fillRect(0, 0, 16, 16);

    for (const [a, b] of [[3, 2], [11, 5], [6, 11], [13, 13], [1, 9]]) x.fillRect(a, b, 2, 1);
  }

}

function qNewFloor() {
  q.floor++;
  const grid = Array.from({ length: QMAP }, () => new Uint8Array(QMAP).fill(1)), rooms = [];
  for (let i = 0; i < 9; i++) {
    const w = 4 + Math.floor(rnd(0, 5)), h = 3 + Math.floor(rnd(0, 4));
    const x = 2 + Math.floor(rnd(0, QMAP - w - 4)), y = 2 + Math.floor(rnd(0, QMAP - h - 4));
    for (let b = y; b < y + h; b++) for (let a = x; a < x + w; a++) grid[b][a] = 0;
    const prev = rooms[rooms.length - 1], cx = x + (w >> 1), cy = y + (h >> 1);
    if (prev) {
      for (let a = Math.min(prev.cx, cx); a <= Math.max(prev.cx, cx); a++) grid[prev.cy][a] = 0;
      for (let b = Math.min(prev.cy, cy); b <= Math.max(prev.cy, cy); b++) grid[b][cx] = 0;
    }
    rooms.push({ x, y, w, h, cx, cy });
  }
  q.map = grid;
  q.x = rooms[0].cx; q.y = rooms[0].cy;
  const last = rooms[rooms.length - 1];
  q.stairs = [last.cx, last.cy];
  q.chests = rooms.slice(1, -1).filter((_, i) => i % 2 === 0).map(r => ({ x: r.x + Math.floor(rnd(0, r.w)), y: r.y + Math.floor(rnd(0, r.h)), open: false }));
  q.theme = Q_THEMES[(q.floor - 1) % Q_THEMES.length];
  q.route = []; q.at = 0; q.step = 0; q.state = 'walk'; q.fade = 1; q.boss = q.floor % 5 === 0;
  qSay(`${q.theme.name} B${q.floor}F`);
}

function qPath(tx, ty) {
  const from = new Map([[q.x + q.y * QMAP, -1]]), queue = [[q.x, q.y]];
  for (let head = 0; head < queue.length; head++) {
    const [x, y] = queue[head];
    if (x === tx && y === ty) break;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const key = x + dx + (y + dy) * QMAP;
      if (q.map[y + dy]?.[x + dx] !== 0 || from.has(key)) continue;
      from.set(key, x + y * QMAP);
      queue.push([x + dx, y + dy]);
    }
  }
  const path = [];
  for (let key = tx + ty * QMAP; key !== undefined && key !== -1; key = from.get(key)) path.unshift([key % QMAP, Math.floor(key / QMAP)]);
  return path.slice(1);
}

function qPlan() {
  const left = q.chests.filter(ch => !ch.open);
  const routes = left.map(ch => qPath(ch.x, ch.y)).filter(p => p.length).sort((a, b) => a.length - b.length);
  q.route = routes[0] || qPath(...q.stairs);
  q.at = 0;
}

function qLoot(chest) {
  chest.open = true; q.opened++;
  const roll = Math.random();
  if (roll < .4) {
    const coins = Math.floor(rnd(20, 60) * q.floor);
    q.gold += coins;
    qSay(`Found ${coins} GIL!`);
  } else if (roll < .65) {
    q.potions++;
    qSay('Found a POTION!');
  } else {
    const hero = q.party[Math.floor(rnd(0, 4))], tier = Q_GEAR[Math.min(Q_GEAR.length - 1, Math.floor((q.floor + 1) / 2))];
    const armor = Math.random() < .4, kind = armor ? 'MAIL' : hero.job === 'FIGHTER' ? 'SWORD' : hero.job === 'THIEF' ? 'KNIFE' : 'STAFF';
    if (armor) hero.def += 2; else hero.atk += 2;
    if (!armor) hero.gear = `${tier} ${kind}`;
    qSay(`${hero.name} found ${tier} ${kind}!`);
  }
}

function qFight(boss) {
  const scale = 1 + q.floor * .3, pool = Q_FOES.slice(0, Math.min(Q_FOES.length, 2 + Math.ceil(q.floor / 2)));
  const foe = (type, big, x, y) => {
    const hp = Math.round((type.hp || 90) * scale * (big ? 1.5 : 1));
    return { ...type, hp, max: hp, atk: Math.round((type.atk || 11) * (1 + q.floor * .14) + q.floor * 1.6), xp: Math.round((type.xp || 90) * scale), big, x, y, flash: 0, dead: false, name: type.name };
  };
  const count = boss ? 1 : 1 + Math.floor(rnd(0, 4));
  const foes = boss
    ? [foe(Q_BOSSES[(q.floor / 5 - 1) % Q_BOSSES.length], true, 128, 70)]
    : Array.from({ length: count }, (_, i) => foe(pool[Math.floor(rnd(0, pool.length))], false, 122 + (i % 2) * 38, 52 + (i >> 1) * 42 + (i % 2) * 8));
  q.battle = { foes, queue: [], boss, pops: [], fire: 0 };
  q.state = 'battle'; q.wait = .9; q.fade = 1;
  qSay(boss ? `${foes[0].name} blocks the stairs!` : `${foes.length > 1 ? 'Monsters' : `A ${foes[0].name}`} appeared!`);
}

function qPop(x, y, text, col) { q.battle.pops.push({ x, y, text, col, life: 1 }); }

function qHeroAct(hero, foes) {
  const hurt = q.party.filter(h => h.hp > 0).sort((a, b) => a.hp / a.max - b.hp / b.max)[0];
  hero.step = 1;
  if (hero.job === 'W.MAGE' && hero.mp >= 2 && hurt.hp < hurt.max * .55) {
    const heal = 14 + hero.lvl * 3;
    hurt.hp = Math.min(hurt.max, hurt.hp + heal); hero.mp -= 2;
    qSay(`${hero.name} casts CURE on ${hurt.name}. +${heal}`);
    return;
  }
  const target = foes[Math.floor(rnd(0, foes.length))];
  const fire = hero.job === 'B.MAGE' && hero.mp >= 2;
  let dmg = Math.max(1, Math.round((fire ? 12 + hero.lvl * 4 : hero.atk + hero.lvl * 1.5) * rnd(.85, 1.2)));
  const crit = hero.job === 'THIEF' && Math.random() < .25;
  if (crit) dmg *= 2;
  if (fire) { hero.mp -= 2; q.battle.fire = 1; }
  target.hp -= dmg; target.flash = 1;
  qPop(target.x + 14, target.y, String(dmg), crit ? '#ffd24a' : '#fff');
  qSay(`${hero.name} ${fire ? 'casts FIRE' : crit ? 'lands a critical' : 'attacks'}! ${target.name} -${dmg}`);
  if (target.hp <= 0) { target.dead = true; qSay(`${target.name} is defeated!`); }
}

function qFoeAct(foe) {
  const alive = q.party.filter(h => h.hp > 0), hero = alive[Math.floor(rnd(0, alive.length))];
  const dmg = Math.max(1, Math.round((foe.atk - hero.def * .5) * rnd(.8, 1.2)));
  hero.hp = Math.max(0, hero.hp - dmg); hero.flash = 1;
  qPop(202, 60 + q.party.indexOf(hero) * 22, String(dmg), '#ff9090');
  qSay(`${foe.name} hits ${hero.name}. -${dmg}`);
  if (!hero.hp) qSay(`${hero.name} has fallen!`);
}

function qWin() {
  const { foes, boss } = q.battle;
  const xp = foes.reduce((n, f) => n + f.xp, 0), coins = Math.floor(foes.reduce((n, f) => n + f.max, 0) * .8);
  q.gold += coins; q.wins++;
  qSay(`Victory! ${xp} EXP, ${coins} GIL`);
  for (const h of q.party) {
    if (!h.hp) { h.hp = Math.ceil(h.max / 4); continue; }
    h.xp += xp;
    while (h.xp >= h.lvl * h.lvl * 18 + 12) {
      h.xp -= h.lvl * h.lvl * 18 + 12; h.lvl++;
      h.max += h.job === 'FIGHTER' ? 9 : 6; h.hp = h.max; h.atk += h.job.includes('MAGE') ? 1 : 2; h.def += 1;
      if (h.maxMp) { h.maxMp += 3; h.mp = h.maxMp; }
      qSay(`${h.name} is now level ${h.lvl}!`);
    }
  }
  const low = q.party.slice().sort((a, b) => a.hp / a.max - b.hp / b.max)[0];
  if (q.potions && low.hp < low.max * .5) { q.potions--; low.hp = Math.min(low.max, low.hp + 40); qSay(`${low.name} drinks a POTION.`); }
  if (boss) { q.boss = false; q.potions += 2; qSay('The way down is open! +2 POTIONS'); }
  q.state = 'spoils'; q.wait = 1.6;
}

function qDescend() {
  if (q.boss) return qFight(true);
  for (const h of q.party) { h.hp = Math.min(h.max, h.hp + Math.ceil(h.max / 3)); h.mp = Math.min(h.maxMp, h.mp + 4); }
  qNewFloor();
}

function questUpdate(dt) {
  if (!q.map) { qNewParty(); qNewFloor(); }
  q.fade = Math.max(0, q.fade - dt * 2.5);
  if (q.state === 'walk') {
    if (q.at >= q.route.length) qPlan();
    if (!q.route.length) {
      // Already standing on the goal, as after a boss fight on the stairs.
      q.step = 0;
      const chest = q.chests.find(ch => !ch.open && ch.x === q.x && ch.y === q.y);
      if (chest) { qLoot(chest); q.state = 'pause'; q.wait = 1; } else qDescend();
      return;
    }
    const next = q.route[q.at];
    q.dx = next[0] - q.x; q.dy = next[1] - q.y;
    q.step += dt * 5.5;
    if (q.step < 1) return;
    q.step = 0; q.at++; q.steps++; q.flip = !q.flip;
    q.x = next[0]; q.y = next[1];
    if (q.steps % 7 === 0) for (const h of q.party) if (h.hp) h.hp = Math.min(h.max, h.hp + 1);
    const chest = q.chests.find(ch => !ch.open && ch.x === q.x && ch.y === q.y);
    if (chest) { qLoot(chest); q.state = 'pause'; q.wait = 1; q.route = []; return; }
    if (q.x === q.stairs[0] && q.y === q.stairs[1] && !q.chests.some(ch => !ch.open)) return qDescend();
    if (q.steps > 7 && Math.random() < .07) { q.steps = 1; qFight(false); }
  } else if (q.state === 'pause') {
    q.wait -= dt;
    if (q.wait <= 0) q.state = 'walk';
  } else if (q.state === 'spoils') {
    q.wait -= dt;
    if (q.wait <= 0) { q.battle = null; q.state = 'walk'; q.fade = 1; q.route = []; }
  } else if (q.state === 'wiped') {
    q.wait -= dt;
    if (q.wait <= 0) {
      // Every wipe starts a brand new run with a brand new party.
      q.best = Math.max(q.best, q.floor);
      q.run++; q.gold = 0; q.potions = 2; q.floor = 0; q.battle = null;
      qNewParty();
      qSay(`RUN ${q.run} begins. ${q.names[0]}'s party sets out.`);
      qNewFloor();
    }
  } else if (q.state === 'battle') {
    const b = q.battle;
    for (const h of q.party) { h.flash = Math.max(0, h.flash - dt * 3); h.step = Math.max(0, h.step - dt * 2); }
    for (const f of b.foes) f.flash = Math.max(0, f.flash - dt * 3);
    b.fire = Math.max(0, b.fire - dt * 3);
    q.wait -= dt;
    if (q.wait > 0) return;
    const foes = b.foes.filter(f => !f.dead), heroes = q.party.filter(h => h.hp > 0);
    if (!foes.length) return qWin();
    if (!heroes.length) { qSay('The party has fallen...'); q.state = 'wiped'; q.wait = 2.4; return; }
    if (!b.queue.length) b.queue = [...heroes, ...foes].sort(() => Math.random() - .5);
    const actor = b.queue.shift();
    if (actor.job) { if (actor.hp > 0) qHeroAct(actor, foes); } else if (!actor.dead) qFoeAct(actor);
    q.wait = .85;
  }
}

function qDrawHero(hero, x, y, alt) {
  const pal = { 1: hero.hp ? hero.hair : '#606060', 2: hero.hp ? '#f0c8a0' : '#909090', 3: hero.hp ? hero.tunic : '#505050', 4: '#201810' };
  qc.drawImage(qSprite(`hero${alt ? 'b' : 'a'}`, alt ? Q_HERO_B : Q_HERO, pal), Math.round(x), Math.round(y));
}

function qDrawMap() {
  const px = (q.x + q.dx * q.step) * QTILE, py = (q.y + q.dy * q.step) * QTILE;
  const camX = Math.round(px - QW / 2 + 8), camY = Math.round(py - QH / 2 + 8), wall = qTile(q.theme, true), floor = qTile(q.theme, false);
  qc.fillStyle = '#000'; qc.fillRect(0, 0, QW, QH);
  for (let y = Math.floor(camY / QTILE); y * QTILE < camY + QH; y++) for (let x = Math.floor(camX / QTILE); x * QTILE < camX + QW; x++) {
    const solid = q.map[y]?.[x] ?? 1;
    qc.drawImage(solid ? wall : floor, x * QTILE - camX, y * QTILE - camY);
  }
  const [sx, sy] = q.stairs;
  qc.fillStyle = '#000'; qc.fillRect(sx * QTILE - camX + 2, sy * QTILE - camY + 2, 12, 12);
  qc.fillStyle = q.theme.hi;
  for (let i = 0; i < 4; i++) qc.fillRect(sx * QTILE - camX + 3 + i, sy * QTILE - camY + 3 + i * 3, 10 - i * 2, 2);
  for (const ch of q.chests) {
    const x = ch.x * QTILE - camX, y = ch.y * QTILE - camY;
    qc.fillStyle = '#6a3a14'; qc.fillRect(x + 2, y + 4, 12, 10);
    qc.fillStyle = ch.open ? '#120a04' : '#b06a28'; qc.fillRect(x + 3, y + 5, 10, ch.open ? 4 : 3);
    qc.fillStyle = '#f0c840'; qc.fillRect(x + 7, y + 8, 2, 3);

}

function qDrawBattle(t) {
  const b = q.battle, th = q.theme;
  qc.fillStyle = '#000'; qc.fillRect(0, 0, QW, QH);
  for (let x = 0; x < QW; x += 16) { qc.drawImage(qTile(th, true), x, 8); qc.drawImage(qTile(th, true), x, 24); }
  qc.fillStyle = th.floor; qc.fillRect(0, 40, QW, 4);

    if (f.flash > .4 && Math.floor(t * 30) % 2) continue;
    qc.drawImage(s, f.x, f.y + Math.sin(t * 3 + f.x) * 1.5, s.width * scale, s.height * scale);
  }

// Each shuffle plays everything once before repeating.
const SHUFFLE_SECONDS = { classics: 25, wmp9: 25, xp: 25, spooky: 40, chill: 90 };
let shuffleMode = '', shuffleAt = 0, shuffleBag = [];

function shuffleStep() {
  const spooky = shuffleMode === 'spooky', current = spooky ? (classic < 0 ? sceneIx : -1) : classic;
  if (!shuffleBag.length) {
    const pool = spooky ? [...scenes.keys()] : [...CLASSICS.keys()].filter(n => CLASSICS[n][2] === shuffleMode);
    shuffleBag = pool.filter(n => n !== current);
    shuffleBag.sort(() => Math.random() - .5);
  }
  const n = shuffleBag.pop();
  spooky ? setScene(n, clock) : setClassic(n);
  shuffleAt = clock + SHUFFLE_SECONDS[shuffleMode];
}

function setShuffle(mode) {
  shuffleMode = mode; shuffleBag = [];
  document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  if (mode) shuffleStep();
}

function setScene(i, t) {
  if (classic >= 0) setClassic(-1);
  sceneIx = (i + scenes.length) % scenes.length;
  sceneAt = t; wipe = 1; ghosts.length = 0; motes.length = 0;
  $('sceneName').textContent = sceneIx + 1;
  document.body.classList.toggle('stark', scenes[sceneIx].name === 'THE WHITE CITY');
  [...$('picker').children].forEach((b, n) => b.classList.toggle('on', n === sceneIx));

}

function overlays(t, dt) {
  if (A.big && t - lastFlash > 7 && A.level > .15) { flash = .12; lastFlash = t; }
  if (flash > .01) {
    c.fillStyle = `rgba(215,225,255,${flash})`; c.fillRect(0, 0, W, H);
    flash *= Math.pow(.84, dt * 60);
  }
  const v = c.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .4, W / 2, H / 2, Math.hypot(W, H) * .56);
  v.addColorStop(0, 'transparent'); v.addColorStop(1, 'rgba(0,0,0,.72)');
  c.fillStyle = v; c.fillRect(0, 0, W, H);
  const age = t - cardAt;
  if (card && age < 6) {
    c.save();
    c.globalAlpha = clamp(Math.min(age * 2, (6 - age) * 1.5));
    c.textAlign = 'center';
    let size = 66 * U;
    c.font = `${size}px Creepster, Impact, sans-serif`;
    const fit = c.measureText(card).width;
    if (fit > W * .88) { size *= W * .88 / fit; c.font = `${size}px Creepster, Impact, sans-serif`; }
    c.lineWidth = 7 * U; c.strokeStyle = '#000'; c.fillStyle = '#ff8a1e'; c.lineJoin = 'round';
    c.strokeText(card, W / 2, H * .9); c.fillText(card, W / 2, H * .9);
    c.restore();
  }
  if (wipe > .01) { c.fillStyle = `rgba(0,0,0,${wipe})`; c.fillRect(0, 0, W, H); wipe *= Math.pow(.9, dt * 60); }
}

const yt = { player: null, ready: false, playing: false, list: null, seeking: false, title: '', skipped: 0 };

function parseList(text) {
  const s = (text || '').trim();
  return s.match(/[?&]list=([\w-]+)/)?.[1] || (/^[\w-]{10,}$/.test(s) ? s : null);
}

function loadList(id, autoplay) {
  yt.list = id; yt.skipped = 0;
  $('yt-empty').hidden = true;
  store.set('ghoulamp.list', id);
  if (!yt.ready) return;
  const opts = { list: id, listType: 'playlist' };
  autoplay ? yt.player.loadPlaylist(opts) : yt.player.cuePlaylist(opts);
  yt.player.setLoop(true);
}

window.onYouTubeIframeAPIReady = () => {
  const http = location.protocol.startsWith('http');
  yt.player = new YT.Player('yt', {
    width: '100%', height: '100%',
    playerVars: { playsinline: 1, rel: 0, modestbranding: 1, ...(http ? { origin: location.origin } : {}) },
    events: {
      onReady() {
        yt.ready = true;
        yt.player.setVolume(+$('vol').value);
        if (yt.list) loadList(yt.list, false);
      },
      onStateChange(e) {
        yt.playing = e.data === YT.PlayerState.PLAYING;
        if (yt.playing) {
          const title = yt.player.getVideoData()?.title;
          if (title && title !== yt.title) {
            yt.title = title; card = title; cardAt = performance.now() / 1000;
            $('title').textContent = `*** ${title} ***`;
          }
        }
      },
      onError(e) {
        // 100, 101 and 150 are removed or embed-blocked tracks: skip them and keep the party going.
        if ([5, 100, 101, 150].includes(e.data)) {
          yt.skipped++;
          note(`Skipped ${yt.skipped} track${yt.skipped > 1 ? 's' : ''} that YouTube won't play in an embed.`);
          yt.player.nextVideo();
        } else note(location.protocol === 'file:' ? 'YouTube needs a web address. Open this from GitHub Pages, not as a file.' : `YouTube error ${e.data}. Check the playlist is public or unlisted.`, true);
      },
    },
  });
};

function syncPlayer() {
  if (!yt.ready || !yt.player.getDuration) return;
  const now = yt.player.getCurrentTime() || 0, dur = yt.player.getDuration() || 0;
  const stamp = `${String(Math.floor(now / 60)).padStart(2, '0')}:${String(Math.floor(now % 60)).padStart(2, '0')}`;
  $('clock').textContent = stamp;
  if (dur && !yt.seeking) $('seek').value = now / dur * 1000;
  const total = yt.player.getPlaylist?.()?.length;
  $('trackNo').textContent = total ? `${yt.player.getPlaylistIndex() + 1}/${total}` : '-/-';
}

  if (k === 'h') toggleParty();
  else if (k === 'escape') setParty(false);
  else if (k === 'q') toggleMenu();
  else if (k === 'f') toggleFull();
  else if (k === 'n') nextScene();
  else if (k === 'w') nextClassic();
  else if (k === 'x') toggleShuffle('classics');
  else if (k === 's') toggleShuffle('spooky');
  else if (e.shiftKey && /^Digit[1-8]$/.test(e.code)) pickScene(8 + +e.code.slice(5));
  else if (k >= '1' && k <= '9') pickScene(+k - 1);
});

for (const bar of document.querySelectorAll('[data-drag]')) {
  bar.onpointerdown = e => {
    if (e.target.closest('button')) return;
    const win = bar.parentElement, r = win.getBoundingClientRect(), dx = e.clientX - r.left, dy = e.clientY - r.top;
    bar.setPointerCapture(e.pointerId);
    document.body.classList.add('dragging');
    bar.onpointermove = ev => {
      win.style.left = `${clamp(ev.clientX - dx, 0, innerWidth - 60)}px`;
      win.style.top = `${clamp(ev.clientY - dy, 0, innerHeight - 30)}px`;
    };
    bar.onpointerup = () => { bar.onpointermove = null; document.body.classList.remove('dragging'); };
  };
}

/* ---------- go ---------- */
let last = 0, frameNo = 0;
function frame(ms) {
  requestAnimationFrame(frame);
  const t = ms / 1000, dt = Math.min(.05, t - last || .016);
  last = t;
  readAudio(t, dt * 60);
  clock = t;
  if (shuffleMode && t > shuffleAt) shuffleStep();
  if (classic >= 0) CLASSICS[classic][1](t, dt);
  else {
    if (!shuffleMode && t - sceneAt > SCENE_SECONDS && A.beat) setScene(sceneIx + 1, t);
    scenes[sceneIx].draw(t, dt);
  }
  // Saved here so captions and the vignette stay out of the trails.
  bc.globalCompositeOperation = 'copy';
  bc.drawImage(stage, 0, 0);
  overlays(t, dt);
  drawMini();
  if (++frameNo % 15 === 0) { syncPlayer(); tabStatus(t); syncDock(); }
}

setScene(0, 0);
const startList = new URLSearchParams(location.search).get('list') || parseList(PLAYLIST) || store.get('ghoulamp.list');
if (startList) { yt.list = startList; $('yt-empty').hidden = true; $('url').value = `https://www.youtube.com/playlist?list=${startList}`; }
const startMode = new URLSearchParams(location.search);
if (startMode.has('chill')) setShuffle('chill');
if (startMode.has('quest')) setClassic(CLASSICS.findIndex(([, draw]) => draw === drawQuest));
if (location.protocol === 'file:') note('YouTube needs a web address. Open this from GitHub Pages, not as a file.', true);

const api = document.createElement('script');
api.src = 'https://www.youtube.com/iframe_api';
api.onerror = () => note('Could not reach YouTube. Check the internet connection.', true);
document.head.append(api);
document.fonts?.load('40px Creepster');
requestAnimationFrame(frame);
window.ghoulamp = { audio: A, yt, setScene, shuffleStep, mz, q, questUpdate, chat, chatLine, chatPools: { Q_CHAT, CHAT_ANY, CHAT_CALM, CHAT_PANIC, CHAT_DEAD, CHAT_REPLIES, CHATTERS }, questChatVars };
</script>
