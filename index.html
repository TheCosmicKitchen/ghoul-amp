// Expands the grammar, then reads the ~tags~ out of the sentence to build the rule's behaviour.
function gMakeRule() {
  const pick = l => l[Math.floor(rnd(0, l.length))];
  for (let i = 0; i < 30; i++) {
    const r = { fired: 0, flash: 0 };
    const colour = () => pick([...new Set(G.tc)]);
    const text = chatExpand('gr_rule').replace(/~(\w+)(?::(\w+))?(?::(\w+))?~/g, (_, key, a, b) => {
      if (key === 'on') { r.on = a; return ''; }
      if (key === 'do') { r.do = a; r.ev = b; return ''; }
      if (key === 'col') { r.col = colour(); return G_NAMES[r.col]; }
      if (key === 'col2') { r.col2 = (G.cols.filter(k => k !== r.col)[0]) ?? r.col; return G_NAMES[r.col2]; }
      if (key === 'prop') { r.prop = pick(G.props).kind; return r.prop; }
      if (key === 'n') { const [word, n] = pick([['one', 1], ['two', 2], ['three', 3], ['five', 5], ['nine', 9]]); r.n = n; return word; }
      if (key === 'unit') return G.unit.toLowerCase();
      return '';
    }).replace(/ {2,}/g, ' ').trim();
    if (text.length <= 74 && r.on && r.do && !G.rules.some(o => o.text === text)) return { ...r, text };
  }
  return null;
}

function gAddRule() {
  const r = gMakeRule();
  if (!r) return null;
  r.n0 = ++G.ruleNo;
  G.rules.push(r);
  if (G.rules.length > 8) G.rules.shift();
  return r;
}

const gLeader = () => G.players.reduce((best, p, i) => (p.score > G.players[best].score ? i : best), 0);
const gLast = () => G.players.reduce((best, p, i) => (p.score < G.players[best].score ? i : best), 0);
const gMine = who => G.pieces.filter(k => k.owner === who);
function gShift(piece, by) { piece.from = piece.at; piece.to = ((piece.at + by) % G.tiles + G.tiles) % G.tiles; piece.q = 0; piece.main = false; }

function gObey(r, who, t) {
  const p = G.players[who], lead = gLeader(), low = gLast(), piece = gMine(who)[0], prop = G.props.find(k => k.kind === r.prop);
  switch (r.do) {
    case 'gain': p.score += r.n; break;
    case 'lose': p.score -= r.n; break;
    case 'steal': G.players[lead].score -= r.n; p.score += r.n; break;
    case 'fwd': if (piece) gShift(piece, r.n); break;
    case 'back': if (piece) gShift(piece, -r.n); break;
    case 'skip': G.skip[who]++; break;
    case 'extra': G.extra = true; break;
    case 'reverse': G.dir *= -1; break;
    case 'give': if (prop) { prop.holder = low; } break;
    case 'spawn': G.props.push({ kind: r.prop, tile: Math.floor(rnd(0, G.tiles)), holder: -1 }); if (G.props.length > 9) G.props.shift(); break;
    case 'recolour': G.tc = G.tc.map(k => (k === r.col ? r.col2 : k)); break;
    case 'cards': p.cards = Math.min(9, p.cards + r.n); break;
    case 'swap': { const a = gMine(who)[0], b = gMine(lead)[0]; if (a && b && a !== b) { const at = a.at; gShift(a, b.at - a.at); gShift(b, at - b.at); } break; }

    case 'write': gAddRule(); break;
    case 'ev': gEvent(t, r.ev); break;

function gCheck(type, who, t, ctx = {}) {
  const hit = G.rules.filter(r => {
    if (r.on !== type) return false;
    if (type === 'land') return ctx.col === r.col;
    if (type === 'landprop') return ctx.props?.includes(r.prop);
    if (type === 'hold') return G.props.some(k => k.kind === r.prop && k.holder === who);

  G.say = { who: (who + 1 + Math.floor(rnd(0, 3))) % 4, text: chatExpand('bg_say').replace('{name}', G.players[who].name.toLowerCase()).replace('{rule}', r.n0), until: t + 3 };

function gLand(piece, t) {

function gStart(t) {

function gTile(i, t) {

}
function rSave() { store.set(R_SAVE, JSON.stringify({ found: R.found, time: R.time })); }

function rUpdate(t, dt) {
  R.t = t; R.time += dt;

      R.news = `The ${R_FISH[i].name.toLowerCase()} joins the tank. ${R.found.length} of ${R_FISH.length} in the book.`; R.nextNews = t + 18;

  }

    if (goal !== null) { f.dir = goal > f.x ? 1 : -1; f.y += (30 + Math.sin(f.ph) * 16 - f.y) * clamp(dt * .4); }
    f.x += f.dir * f.sp * dt;

  R.flakes.forEach(k => { k.y += k.v * dt; k.x += Math.sin(t + k.v) * dt * 3; });

function kHour() {
  if (K.forceHour !== null) return K.forceHour;

const kPart = h => (h < 11 ? 'morning' : h < 17 ? 'day' : 'evening');

function kStart() {

}
function kSave() { store.set(K_SAVE, JSON.stringify({ served: K.served, visits: K.visits })); }

function kSpawn(t) {
  const free = K_SEATS.map((_, i) => i).filter(i => !K.people.some(p => p.seat === i));
  if (!free.length || K.people.length > 6) return;
  const rng = () => V_NAMES[Math.floor(rnd(0, 14))], name = rng();
  if (K.people.some(p => p.name === name)) return;

  K.people.push({ name, x: 306, y: 146, state: 'in', seat: free[Math.floor(rnd(0, free.length))], cloth: V_CLOTHES[seed % V_CLOTHES.length], hair: V_HAIR[seed % V_HAIR.length], skin: ['#f4d0b0', '#ecc4a2', '#d8a878', '#b07a50', '#8a5a3a'][seed % 5], hat: seed % 4 === 0, until: 0, doing: ['read', 'laptop', 'sip', 'knit'][seed % 4] });

function kUpdate(t, dt) {
  K.t = t;
  const h = kHour();
  if (t > K.wxUntil) { K.rain = Math.random() < .6; K.wxUntil = t + rnd(160, 340); }
  if (t > K.nextIn) { kSpawn(t); K.nextIn = t + rnd(14, 34); }

  for (const p of K.people) {

    else if (p.state === 'order') { if (walk(p, 104)) { p.state = 'wait'; p.until = t + 6; K.baristaT = 72; K.brew = t + 6; const part = K_DRINKS[kPart(h)]; p.drink = part[Math.floor(rnd(0, 3))]; p.bubble = `${(K.visits[p.name] || 0) > 1 ? 'the usual, ' : 'one '}${p.drink.toLowerCase()}`; p.bubbleUntil = t + 3.5; } }
    else if (p.state === 'wait') { if (t > p.until) { K.served++; K.visits[p.name] = (K.visits[p.name] || 0) + 1; K.baristaT = 40; K.busy = null; p.state = 'seat'; kSave(); } }
    else if (p.state === 'seat') { if (walk(p, K_SEATS[p.seat][0])) { p.state = 'sit'; p.until = t + rnd(50, 110); } }

}

      aRect(x, 96, 118, 40, 'rgba(244,240,244,.95)'); c.strokeStyle = '#1c1820'; c.lineWidth = .4; c.strokeRect(x, 96, 118, 40);
      side.types.forEach((u, k) => { c.textAlign = 'left'; c.fillStyle = '#463a48'; c.font = `italic 400 5.4px ${vwSans}`; c.fillText(u.name, x + 13, 104 + k * 11); c.font = `400 3.8px ${vwSans}`; c.fillText(`HP ${u.hp}   DMG ${u.dmg}   RNG ${u.range}   ¥${u.cost}M`, x + 13, 108.4 + k * 11); vwUnitDraw({ ...u, size: 5 }, x + 7, 106 + k * 11, 1, { pal: side.pal }, 0, false); });
    });
    c.globalAlpha = 1;
  }
  if (VW.dialog && t < VW.dialog.until && !VW.end) {
    const w = 118, x = 160 - w / 2, y = 38;
    aRect(x + 1, y + 1, w, 21, 'rgba(30,20,40,.3)'); aRect(x, y, w, 21, '#c8c4cc'); c.strokeStyle = '#1c1820'; c.lineWidth = .4; c.strokeRect(x, y, w, 21);
    aRect(x + 1, y + 1, w - 2, 6, '#2a2a88'); c.textAlign = 'left'; c.fillStyle = '#fff'; c.font = `700 3.8px "Segoe UI", sans-serif`; c.fillText('Stock Exchange', x + 3, y + 5.4);
    c.fillStyle = '#1c1820'; c.font = `400 4.4px "Segoe UI", sans-serif`; c.fillText(VW.dialog.text, x + 4, y + 13.4, w - 8);
    aRect(x + w - 22, y + 15, 18, 4.4, '#e4e0e8'); c.strokeRect(x + w - 22, y + 15, 18, 4.4); c.textAlign = 'center'; c.font = `400 3.2px "Segoe UI", sans-serif`; c.fillText('OK', x + w - 13, y + 18.4);
  }
  if (t > VW.nextNews && !VW.end) { const side = VW.sides[Math.floor(rnd(0, 2))]; VW.news = cozyLine('vw_log', { fac: side.name, unit: side.types[Math.floor(rnd(0, 3))].name }); VW.nextNews = t + rnd(11, 17); }
  if (SHOW.log && VW.news) { aRect(10, 175.4, 300, .4, ink); c.textAlign = 'left'; c.fillStyle = ink; c.font = `italic 400 5.2px ${vwSans}`; c.fillText(VW.news, 11, 172.4); }
  c.textAlign = 'right'; c.fillStyle = ink; c.font = `italic 400 5.2px ${vwSans}`; c.fillText(`Match ${VW.match}   ${Math.floor(VW.clock / 60)}:${String(Math.floor(VW.clock % 60)).padStart(2, '0')}`, 310, 172.4);
  c.restore();
}

const CLASSICS = [
  ['SWIRL', drawSwirl, 'classics'], ['BARS', drawSpectrum, 'classics'], ['PLASMA', drawPlasma, 'classics'], ['KALEIDO', drawKaleido, 'classics'], ['SCOPE', drawScope, 'classics'],
  ['BATTERY', drawBattery, 'wmp9'], ['ALCHEMY', drawAlchemy, 'wmp9'], ['AMBIENCE', drawAmbience, 'wmp9'], ['FIRE', drawFirestorm, 'wmp9'], ['MIST', drawMist, 'wmp9'],
  ['SPIKES', drawSpikes, 'xp'], ['PLENOPT', drawPlenoptic, 'xp'], ['PARTICLE', drawParticle, 'xp'], ['COLORS', drawColors, 'xp'], ['DOTS', drawDots, 'xp'],
  ['SUNSET', drawSunset, 'chill'], ['AURORA', drawAurora, 'chill'], ['HEARTH', drawHearth, 'chill'], ['RAIN', drawRain, 'chill'],
  ['LAVA', drawLava, 'chill'], ['KOI', drawKoi, 'chill'], ['PEAKS', drawPeaks, 'chill'], ['STARS', drawStarry, 'chill'],
  ['8-BIT QUEST', drawQuest, 'chill'], ['POCKET VILLAGE', drawVillage, 'chill'], ['NIGHT TRAIN', drawTrain, 'chill'], ['ALMANAC FARM', drawFarm, 'chill'],
  ['LONG SAIL', drawSail, 'chill'], ['REEF TANK', drawReef, 'chill'], ['CORNER CAFE', drawCafe, 'chill'], ['THE GAME', drawBoardGame, 'chill'],
  ['LO-FI ROOM', drawRoom, 'chill'], ['LONG TRAIL', drawTrail, 'chill'], ['TERRARIUM', drawTerrarium, 'chill'], ['OBSERVATORY', drawObservatory, 'chill'], ['HOSTILE TAKEOVER', drawTakeover, 'chill'],
];

// Each shuffle plays everything once before repeating.
const SHUFFLE_SECONDS = { classics: 25, wmp9: 25, xp: 25, spooky: 40, chill: 90 };
let shuffleMode = '', shuffleAt = 0, shuffleBag = [];

function shuffleStep() {
  const spooky = shuffleMode === 'spooky', current = spooky ? (classic < 0 ? sceneIx : -1) : classic;
  if (!shuffleBag.length) {
    const pool = spooky ? [...scenes.keys()] : [...CLASSICS.keys()].filter(n => CLASSICS[n][2] === shuffleMode);
    shuffleBag = pool.filter(n => n !== current);
    shuffleBag.sort(() => Math.random() - .5);
  }
  const n = shuffleBag.pop();
  spooky ? setScene(n, clock) : setClassic(n);
  shuffleAt = clock + SHUFFLE_SECONDS[shuffleMode];
}

function setShuffle(mode) {
  shuffleMode = mode; shuffleBag = [];
  document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  if (mode) shuffleStep();
}

function setScene(i, t) {
  if (classic >= 0) setClassic(-1);
  sceneIx = (i + scenes.length) % scenes.length;
  sceneAt = t; wipe = 1; ghosts.length = 0; motes.length = 0;
  $('sceneName').textContent = sceneIx + 1;
  document.body.classList.toggle('stark', scenes[sceneIx].name === 'THE WHITE CITY');
  [...$('picker').children].forEach((b, n) => b.classList.toggle('on', n === sceneIx));
  syncFrame();
}

function overlays(t, dt) {
  if (A.big && t - lastFlash > 7 && A.level > .15) { flash = .12; lastFlash = t; }
  if (flash > .01) {
    c.fillStyle = `rgba(215,225,255,${flash})`; c.fillRect(0, 0, W, H);
    flash *= Math.pow(.84, dt * 60);
  }
  const v = c.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .4, W / 2, H / 2, Math.hypot(W, H) * .56);
  v.addColorStop(0, 'transparent'); v.addColorStop(1, 'rgba(0,0,0,.72)');
  c.fillStyle = v; c.fillRect(0, 0, W, H);
  const age = t - cardAt;
  if (card && age < 6) {
    c.save();
    c.globalAlpha = clamp(Math.min(age * 2, (6 - age) * 1.5));
    c.textAlign = 'center';
    let size = 66 * U;
    c.font = `${size}px Creepster, Impact, sans-serif`;
    const fit = c.measureText(card).width;
    if (fit > W * .88) { size *= W * .88 / fit; c.font = `${size}px Creepster, Impact, sans-serif`; }
    c.lineWidth = 7 * U; c.strokeStyle = '#000'; c.fillStyle = '#ff8a1e'; c.lineJoin = 'round';
    c.strokeText(card, W / 2, H * .9); c.fillText(card, W / 2, H * .9);
    c.restore();
  }
  if (wipe > .01) { c.fillStyle = `rgba(0,0,0,${wipe})`; c.fillRect(0, 0, W, H); wipe *= Math.pow(.9, dt * 60); }
}

/* ---------- drawing helpers ---------- */
let clock = 0;
function say(text) { card = text; cardAt = clock; }

function poly(pts, fill) {
  c.beginPath();
  pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y));
  c.closePath(); c.fillStyle = fill; c.fill();
}
function oval(x, y, rx, ry, fill) { c.fillStyle = fill; c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, 7); c.fill(); }

/* ---------- the little Winamp display ---------- */
const mini = $('mini'), m = mini.getContext('2d');
let scope = false;
mini.onclick = () => { scope = !scope; };

function drawMini() {
  const w = mini.width, h = mini.height;
  m.fillStyle = '#05060a'; m.fillRect(0, 0, w, h);
  if (scope) {
    m.fillStyle = '#7dff5a';
    for (let x = 0; x < w; x++) {
      const s = (A.wave[x * 6] - 128) / 128;
      m.fillRect(x, Math.round(h / 2 + s * h * .9), 1, 1);
    }
    return;
  }
  const n = 19, bw = Math.floor(w / n);
  for (let i = 0; i < n; i++) {
    const b = Math.floor(i * BARS / n), rows = Math.round(A.bars[b] * h / 2);
    for (let r = 0; r < rows; r++) {
      const p = r / (h / 2);
      m.fillStyle = p > .75 ? '#ff3a2a' : p > .45 ? '#ff9a1e' : '#7dff5a';
      m.fillRect(i * bw, h - 2 - r * 2, bw - 1, 1);
    }
    m.fillStyle = '#e9e0c9';
    m.fillRect(i * bw, h - 2 - Math.round(A.peaks[b] * h / 2) * 2, bw - 1, 1);
  }
}

function syncClock() {
  const d = new Date();
  $('clock').textContent = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

/* ---------- controls ---------- */

let dockAt = 0, dockPinned = store.get('winvamp.pin') === '1';
let dockQuiet = 0;
const wakeDock = () => {
  if (clock < dockQuiet) return;
  dockAt = clock;
  document.body.classList.remove('dock-away');
};
const setParty = on => { document.body.classList.toggle('party', on); wakeDock(); };
const toggleParty = () => setParty();
function setDockBottom(on) {
  document.body.classList.toggle('dock-bottom', on);
  $('dockFlip').textContent = on ? 'TOP' : 'BOTTOM';
  store.set('winvamp.bottom', on ? '1' : '0');
}
function setDockPin(on) {
  dockPinned = on;
  $('dockPin').classList.toggle('on', on);
  store.set('winvamp.pin', on ? '1' : '0');
  wakeDock();
}
// Slides the bar away once the mouse has been still for a few seconds.
function syncDock() {
  $('dockClock').textContent = $('clock').textContent;
  $('dockTitle').textContent = $('title').textContent.replace(/\*/g, '').trim();
  const body = document.body;
  if (body.classList.contains('party') && !dockPinned && $('menu').hidden && !$('dock').matches(':hover') && clock - dockAt > 3) body.classList.add('dock-away');
}
addEventListener('pointermove', wakeDock);
addEventListener('pointerdown', wakeDock);
$('dockFlip').onclick = () => setDockBottom(!document.body.classList.contains('dock-bottom'));
$('dockPin').onclick = () => setDockPin(!dockPinned);
$('trainLine').onclick = tCycleMode;
$('newVillage').onclick = () => { if (confirm('Start a new village? The current one will be lost.')) vStart(true); };
$('dockHide').onclick = () => { dockQuiet = clock + 1.2; document.body.classList.add('dock-away'); };
$('mainHide').onclick = () => setParty(true);

// Drag any corner grip to resize. Sizes are remembered per window.
const SIZE_LIMITS = { main: [260, 720], menu: [300, 720] };
let sizes = { main: 366, menu: 400 };
try { sizes = { ...sizes, ...JSON.parse(store.get('winvamp.sizes') || '{}') }; } catch {}
function applySizes() {
  $('main').style.zoom = sizes.main / 366;
  $('menu').style.zoom = sizes.menu / 400;
}
for (const grip of document.querySelectorAll('.grip')) {
  grip.onpointerdown = e => {
    e.preventDefault();
    grip.setPointerCapture(e.pointerId);
    document.body.classList.add('dragging');
    const key = grip.dataset.size, r = grip.parentElement.getBoundingClientRect();
    grip.onpointermove = ev => {
      const [low, high] = SIZE_LIMITS[key];
      sizes[key] = clamp(ev.clientX - r.left, low, Math.min(high, innerWidth - 16));
      applySizes();
    };
    grip.onpointerup = () => {
      grip.onpointermove = grip.onpointerup = null;
      document.body.classList.remove('dragging');
      store.set('winvamp.sizes', JSON.stringify(sizes));
    };
  };
}
applySizes();
document.querySelectorAll('[data-click]').forEach(b => { b.onclick = () => $(b.dataset.click).click(); });
setDockBottom(store.get('winvamp.bottom') === '1');
setDockPin(dockPinned);
const toggleFull = () => {
  if (document.fullscreenElement) return document.exitFullscreen();
  setParty(true);
  document.documentElement.requestFullscreen().catch(() => {});
};
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) setParty(false); });
const toggleMenu = () => {
  $('menu').hidden = !$('menu').hidden;
  document.querySelectorAll('#menuBtn, [data-click="menuBtn"]').forEach(b => b.classList.toggle('on', !$('menu').hidden));
  wakeDock();
};
$('menuBtn').onclick = toggleMenu;
const nextScene = () => setScene(sceneIx + 1, performance.now() / 1000);
$('party').onclick = toggleParty;
$('full').onclick = toggleFull;
$('scene').onclick = nextScene;
const pickScene = i => { setShuffle(''); setScene(i, performance.now() / 1000); };
const nextClassic = () => { setShuffle(''); classic + 1 < CLASSICS.length ? setClassic(classic + 1) : setScene(sceneIx, performance.now() / 1000); };
const toggleShuffle = mode => setShuffle(shuffleMode === mode ? '' : mode);
document.querySelectorAll('[data-mode]').forEach(b => { b.onclick = () => toggleShuffle(b.dataset.mode); });
Object.entries(SHOW_LABELS).forEach(([key, label]) => {
  const b = document.createElement('button');
  b.textContent = label;
  b.dataset.show = key;
  const sync = () => {
    b.classList.toggle('on', SHOW[key]);
    b.setAttribute('aria-pressed', SHOW[key]);
    if (key === 'scan') document.body.classList.toggle('no-scan', !SHOW.scan);
  };
  b.onclick = () => { SHOW[key] = !SHOW[key]; store.set('winvamp.show', JSON.stringify(SHOW)); sync(); };
  sync();
  $('toggles').append(b);
});
$('srcOther').onclick = useTab;
CLASSICS.forEach(([name, , group], i) => {
  const b = document.createElement('button');
  b.textContent = name;
  b.dataset.vis = i;
  b.onclick = () => { setShuffle(''); classic === i ? setScene(sceneIx, performance.now() / 1000) : setClassic(i); };
  $(group).append(b);
});
scenes.forEach((s, i) => {
  const b = document.createElement('button');
  b.textContent = i + 1;
  b.title = s.name;
  b.setAttribute('aria-label', `Scene ${i + 1}: ${s.name}`);
  b.onclick = () => pickScene(i);
  $('picker').append(b);
});
stage.ondblclick = toggleParty;
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
  const k = e.key.toLowerCase();
  if (k === 'h') toggleParty();
  else if (k === 'escape') setParty(false);
  else if (k === 'q') toggleMenu();
  else if (k === 'f') toggleFull();
  else if (k === 'n') nextScene();
  else if (k === 'w') nextClassic();
  else if (k === 'x') toggleShuffle('classics');
  else if (k === 's') toggleShuffle('spooky');
  else if (e.shiftKey && /^Digit[1-8]$/.test(e.code)) pickScene(8 + +e.code.slice(5));
  else if (k >= '1' && k <= '9') pickScene(+k - 1);
});

for (const bar of document.querySelectorAll('[data-drag]')) {
  bar.onpointerdown = e => {
    if (e.target.closest('button')) return;
    const win = bar.parentElement, r = win.getBoundingClientRect(), dx = e.clientX - r.left, dy = e.clientY - r.top;
    bar.setPointerCapture(e.pointerId);
    document.body.classList.add('dragging');
    bar.onpointermove = ev => {
      win.style.left = `${clamp(ev.clientX - dx, 0, innerWidth - 60)}px`;
      win.style.top = `${clamp(ev.clientY - dy, 0, innerHeight - 30)}px`;
    };
    bar.onpointerup = () => { bar.onpointermove = null; document.body.classList.remove('dragging'); };
  };
}

/* ---------- go ---------- */
let last = 0, frameNo = 0;
function frame(ms) {
  requestAnimationFrame(frame);
  const t = ms / 1000, dt = Math.min(.05, t - last || .016);
  last = t;
  readAudio(t, dt * 60);
  clock = t;
  if (shuffleMode && t > shuffleAt) shuffleStep();
  if (classic >= 0) CLASSICS[classic][1](t, dt);
  else {
    if (!shuffleMode && t - sceneAt > SCENE_SECONDS && A.beat) setScene(sceneIx + 1, t);
    scenes[sceneIx].draw(t, dt);
  }
  // Saved here so captions and the vignette stay out of the trails.
  bc.globalCompositeOperation = 'copy';
  bc.drawImage(stage, 0, 0);
  overlays(t, dt);
  drawMini();
  if (++frameNo % 15 === 0) { syncClock(); tabStatus(t); syncDock(); }
}

setScene(0, 0);
const startMode = new URLSearchParams(location.search);
if (startMode.has('chill')) setShuffle('chill');
if (startMode.has('quest')) setClassic(CLASSICS.findIndex(([, draw]) => draw === drawQuest));
if (startMode.has('village')) setClassic(CLASSICS.findIndex(([, draw]) => draw === drawVillage));
if (startMode.has('train')) setClassic(CLASSICS.findIndex(([, draw]) => draw === drawTrain));
if (startMode.has('farm')) setClassic(CLASSICS.findIndex(([, draw]) => draw === drawFarm));
if (startMode.has('sail')) setClassic(CLASSICS.findIndex(([, draw]) => draw === drawSail));
if (startMode.has('reef')) setClassic(CLASSICS.findIndex(([, draw]) => draw === drawReef));
if (startMode.has('cafe')) setClassic(CLASSICS.findIndex(([, draw]) => draw === drawCafe));
if (startMode.has('game')) setClassic(CLASSICS.findIndex(([, draw]) => draw === drawBoardGame));
if (startMode.has('takeover') || startMode.has('vapor')) setClassic(CLASSICS.findIndex(([, draw]) => draw === drawTakeover));
if (startMode.has('room')) setClassic(CLASSICS.findIndex(([, draw]) => draw === drawRoom));
if (startMode.has('trail')) setClassic(CLASSICS.findIndex(([, draw]) => draw === drawTrail));
if (startMode.has('terrarium')) setClassic(CLASSICS.findIndex(([, draw]) => draw === drawTerrarium));
if (startMode.has('observatory')) setClassic(CLASSICS.findIndex(([, draw]) => draw === drawObservatory));
// Opens on the village unless the link asks for something else; ?spooky opens the graveyard.
if (!['chill', 'quest', 'village', 'train', 'farm', 'sail', 'reef', 'cafe', 'game', 'room', 'trail', 'terrarium', 'observatory', 'takeover', 'vapor', 'spooky'].some(k => startMode.has(k))) setClassic(CLASSICS.findIndex(([, draw]) => draw === drawVillage));

document.fonts?.load('40px Creepster');
requestAnimationFrame(frame);
window.ghoulamp = { audio: A, setScene, shuffleStep, mz, q, questUpdate, chat, chatLine, chatRules: CHAT_RULES, chatExpand, CHAT_RULE_FOR, questChatVars, SHOW, V, vUpdate, vStart, vCatchUp, vRoute, vOpen, vSyncPeople, T, tUpdate, tCycleMode, G, gUpdate, gMakeRule, VW, vwUpdate, L, lUpdate, Hike, wUpdate, W_ANIMALS, E, eUpdate, O, oUpdate, O_TARGETS, qNewParty, F, fUpdate, S, sUpdate, R, rUpdate, R_FISH, K, kUpdate };
</script>
